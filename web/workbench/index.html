<!doctype html>
<html lang="zh-CN" data-theme="light">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sakura · 任务工作台</title><link rel="stylesheet" href="/workbench/style.css"></head>
<body>
<aside class="sidebar">
 <a class="brand" href="/" aria-label="Sakura 首页"><span class="brand-mark" id="brand-mark"></span><span>Sakura<small>CODING AGENT</small></span></a>
 <div class="workspace"><span class="workspace-symbol">S</span><div><strong id="project-name">工作区</strong><small>本地工作区</small></div><span class="local-dot" title="本地数据"></span></div>
 <div class="nav-label">工作空间</div>
 <nav aria-label="工作空间"><button class="nav-item selected" data-view="overview" aria-label="任务总览"><span data-icon="grid"></span><span>任务总览</span><kbd>1</kbd></button><button class="nav-item" data-view="history" aria-label="运行历史"><span data-icon="history"></span><span>运行历史</span><span class="nav-count" id="run-count">0</span></button><button class="nav-item" data-view="experience" aria-label="经验库"><span data-icon="book"></span><span>经验库</span></button><button class="nav-item" data-view="settings" aria-label="设置"><span data-icon="settings"></span><span>设置</span></button></nav>
 <div class="sidebar-bottom"><div class="local-note"><span class="local-dot"></span><span>数据保存在本地<small>Sakura 独立配置</small></span></div><button class="theme-toggle" id="theme-toggle"><span data-icon="moon"></span><span>深色外观</span><kbd>⇧ D</kbd></button></div>
</aside>
<main class="main">
 <header class="topbar"><div class="breadcrumb"><span data-icon="folder"></span><span id="breadcrumb-name">工作区</span><span class="crumb-divider">/</span><span id="view-title">任务总览</span></div><button class="search-trigger" id="search-trigger"><span data-icon="search"></span><span>搜索运行</span><kbd>⌘ K</kbd></button></header>
 <div class="page"><section class="page-heading"><div><div class="eyebrow">SAKURA WORKSPACE</div><h1 id="page-title">任务工作台</h1><p id="page-subtitle">从计划到交付，看清每一步。</p></div><button class="primary-button" id="new-task"><span data-icon="plus"></span>在终端启动任务</button></section><div id="connection" class="connection"><span class="local-dot"></span><span>读取本地记录</span></div><div id="content"><div class="loading">正在读取运行记录…</div></div><footer class="page-footer"><span>Sakura Coding Agent</span><span>计划有序 · 改动可见 · 结果可查</span></footer></div>
</main>
<dialog id="search-dialog" class="search-dialog"><div class="dialog-search"><span data-icon="search"></span><input id="search-input" placeholder="搜索任务、运行 ID 或状态" aria-label="搜索运行"><button class="icon-button close-dialog" aria-label="关闭搜索">Esc</button></div><div id="search-results"></div></dialog>
<dialog id="task-dialog"><div class="dialog-heading"><div><span class="eyebrow">NEW TASK</span><h2>在终端启动任务</h2></div><button class="icon-button close-dialog" aria-label="关闭">×</button></div><p class="muted">在当前项目的终端执行。工作台会展示保存的运行记录。</p><label for="task-input">你想完成什么？</label><textarea id="task-input" rows="3" placeholder="例如：修复登录刷新问题，并补充回归测试"></textarea><label for="task-command">启动命令</label><pre id="task-command">sakura run '你的任务'</pre><div class="dialog-actions"><button class="secondary-button close-dialog">取消</button><button class="primary-button" id="copy-command">复制命令</button></div></dialog>
<div class="toast" id="toast" role="status"></div>
<script src="/workbench/app.js" type="module"></script>
</body></html>
